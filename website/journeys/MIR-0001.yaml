id: MIR-0001
slug: su-that-va-binh-yen
title: "Sự thật và Bình yên"
subtitle: "Một hành trình tự vấn về lòng can đảm và bản năng tự vệ"
artwork_id: ART-0011
artwork_url: /images/themes/theme_11/slide_1_establishing.jpg
artwork_title: "Wanderer above the Sea of Fog"
artwork_artist: "Caspar David Friedrich (1818)"
estimated_minutes: 3
intro:
  lead: "Chào mừng bạn bước vào The Mirror"
  description: "Đây không phải là bài trắc nghiệm đo nhân cách hay phân loại tâm lý. Đây là một không gian tĩnh lặng, nơi câu hỏi quan trọng hơn câu trả lời. Bạn có thể tạm dừng, suy ngẫm, hoặc rời đi bất kỳ lúc nào."
  button_label: "Bắt đầu chiêm nghiệm"
question:
  prompt: "Giữa một sự thật làm bạn bất an và một lời giải thích giúp bạn yên lòng, điều gì đang níu giữ bạn lúc này?"
  context: "Trong những bước ngoặt của đời sống, chúng ta thường đứng trước lằn ranh này mà không tự nhận ra."
  choices:
    - id: choice_truth
      label: "Tôi khao khát một sự thật trần trụi, dẫu nó mang lại sự bất an sâu sắc."
      reflection_text: "Khi bạn chọn sự thật bằng mọi giá, bạn tin rằng sự rõ ràng sẽ mang lại tự do. Nhưng sự thật trần trụi không có lòng trắc ẩn; nó phơi bày những vết thương mà tâm trí đôi khi chưa đủ vững vàng để băng bó."
      reflection_subtext: "Tự do mà sự thật mang lại thường đi kèm cái giá của sự cô độc tuyệt đối."
      artwork_ref: /images/themes/theme_11/slide_2_closeup.jpg
    - id: choice_peace
      label: "Tôi cần một lời giải thích dịu dàng, giữ lại sự bình yên hiện tại."
      reflection_text: "Tìm kiếm sự bình yên không nhất thiết là sự hèn nhát hay trốn chạy thực tại. Đó có thể là một cơ chế tự vệ cần thiết trước khi bạn đủ sức đối diện với bão giông."
      reflection_subtext: "Một ảo ảnh tử tế đôi khi là chiếc neo duy nhất giữ con người lại với cuộc đời qua những mùa kiệt cùng."
      artwork_ref: /images/themes/theme_11/slide_3_macro.jpg
counterpoint:
  text: "Có khi tìm kiếm sự thật là biểu hiện của lòng can đảm tột cùng; nhưng cũng có khi, nó lại là một cách vô thức để tự trừng phạt chính mình. Ngược lại, khát khao bình yên có thể là sự bao dung, nhưng cũng có thể là sự ru ngủ trước nguy nan."
  subtext: "Ranh giới giữa can đảm và tự hủy hoại, giữa bao dung và tự dối mình, mong manh như một làn khói."
  question: "Điều gì thực sự đang thúc đẩy lựa chọn của bạn: Sự giải thoát thật sự, hay nỗi ám ảnh về việc phải luôn kiểm soát mọi thứ?"
open_ending:
  prompt: "Bạn không cần phải trả lời câu hỏi này ngay lập tức. Hãy mang nó theo bên mình như một chiếc gương soi trong đời sống thường nhật."
  closing_note: "Hôm nay, bạn đang đối diện với điều gì cần thêm lòng can đảm, và điều gì cần bạn học cách buông tay để tự tha thứ cho mình?"
