<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    :root {
      --mark-color: #C29A77;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --mark-color: #76513D;
      }
    }
  </style>
  <!-- Outer Diamond Portal -->
  <rect x="32" y="4" width="39.6" height="39.6" transform="rotate(45 32 4)" stroke="var(--mark-color)" stroke-width="2" fill="none" opacity="0.85"/>
  <!-- Inner Concentric Circle (The Abyss Eye) -->
  <circle cx="32" cy="32" r="16" stroke="var(--mark-color)" stroke-width="1.5" fill="none"/>
  <!-- Geometric H-A Monogram Lines -->
  <line x1="26" y1="22" x2="26" y2="42" stroke="var(--mark-color)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="22" x2="38" y2="42" stroke="var(--mark-color)" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="32" x2="38" y2="32" stroke="var(--mark-color)" stroke-width="1.75"/>
  <path d="M 26 22 L 32 14 L 38 22" stroke="var(--mark-color)" stroke-width="1.75" fill="none" stroke-linejoin="round"/>
</svg>
